# exp005 - Milestone 4: hybrid dual-encoder fusion.
# ConvNeXt-Base (Branch A) and CAFormer-S18 (Branch B) both run on the same
# input. Stages 1-2 use concat fusion; stages 3-4 use cross-attention with
# ConvNeXt as query and CAFormer as key/value. No MSU yet (Milestone 5).
# Both encoders use their pinned ImageNet weights on Colab.

run:
  name: exp005_hybrid_fusion
  seed: 42
  out_dir: runs

data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .jpg          # Kvasir-SEG masks are grayscale JPEG, not strictly binary
  mask_suffix: ""
  cache_path: data/cache/kvasir_seg_256.npz   # built by scripts/build_cache.py; "" reads JPEGs
  image_size: 256
  split_ratios: [0.8, 0.1, 0.1]
  split_seed: 42
  mask_threshold: 127
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2
  pin_memory: true

train:
  epochs: 100
  batch_size: 8
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5     # Branch A
  lr_encoder_b: 1.0e-4    # pretrained Branch B
  lr_head: 3.0e-4         # alignment + fusion + decoder + head
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  amp: true
  channels_last: false

model:
  encoder: dual
  encoder_a: convnext_base.fb_in1k
  encoder_b: caformer_s18.sail_in1k
  pretrained_a: true
  pretrained_b: true
  channels: [64, 128, 320, 512]
  fusion: hybrid          # [concat, concat, xattn, xattn]
  fusion_heads: 8
  pos_enc_2d: false
  msu: false              # Milestone 5
  msu_mode: paper
  skip_convformer: false

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

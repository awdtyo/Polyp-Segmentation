# Default experiment config. Copy this file to expNNN_<description>.yaml for each
# experiment and change only what differs; everything else falls back to
# src/utils.py DEFAULT_CONFIG.
#
# NOTE: data.* describes the folder layout only. The concrete dataset (name,
# image count, 2D vs 3D, mask format) is still TODO - see README "Open questions".

run:
  name: exp000_base
  seed: 42
  out_dir: runs

data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .png
  mask_suffix: ""
  image_size: 256        # must be divisible by 32
  mask_threshold: 127    # pixel value above which a mask pixel is foreground
  normalize: true        # ImageNet mean/std, shared by both branches
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2         # Colab: 2
  pin_memory: true

train:
  epochs: 100
  batch_size: 8
  loss: bce_dice         # bce_dice | dice | jaccard | bce
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5
  lr_encoder_b: 1.0e-4   # 3.0e-4 when the Meta-Polyp branch is trained from scratch
  lr_head: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0    # 0 disables clipping
  amp: true              # ignored on CPU
  channels_last: false

model:
  encoder_a: convnext_base   # convnext_small / convnext_tiny if T4 memory is tight
  encoder_b: caformer_s18    # timm equivalent of the Meta-Polyp encoder
  pretrained_a: true
  pretrained_b: true
  channels: [64, 128, 320, 512]              # fused widths = Meta-Polyp stage widths
  fusion: [concat, concat, xattn, xattn]     # stages 1..4 (strides 4, 8, 16, 32)
  fusion_heads: 8
  pos_enc_2d: false
  msu: true

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

# Default experiment config. Copy this file to expNNN_<description>.yaml for each
# experiment and change only what differs; everything else falls back to
# src/utils.py DEFAULT_CONFIG.
#
# Dataset: Kvasir-SEG (see AGENTS.md section 11). `data.root` points at the
# folder that contains images/ and masks/; on this machine data/raw is a
# git-ignored symlink to the raw Kvasir-SEG download.
#
# Masks are grayscale JPEG, so they are not strictly binary: they are
# thresholded at data.mask_threshold *before* resizing.

run:
  name: exp000_base
  seed: 42
  out_dir: runs

data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .jpg
  mask_suffix: ""
  # Optional .npz cache from scripts/build_cache.py; "" reads the JPEGs directly.
  cache_path: ""
  image_size: 256        # must be divisible by 32
  split_ratios: [0.8, 0.1, 0.1]   # train/val/test, case level
  split_seed: 42
  mask_threshold: 127    # pixel value above which a mask pixel is foreground
  normalize: true        # ImageNet mean/std, shared by both branches
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2         # Colab: 2
  pin_memory: true
  synthetic: false       # true only for smoke/test data; recorded in run_info.json

train:
  epochs: 100
  batch_size: 8
  loss: bce_dice         # bce_dice | dice | jaccard | bce
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5
  lr_encoder_b: 1.0e-4   # 3.0e-4 when the Meta-Polyp branch is trained from scratch
  lr_head: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0    # 0 disables clipping
  amp: true              # ignored on CPU
  channels_last: false

model:
  encoder: dual                           # convnext | caformer | dual
  encoder_a: convnext_base.fb_in1k   # convnext_small.fb_in1k / convnext_tiny.fb_in1k as fallbacks
  encoder_b: caformer_s18.sail_in1k  # timm equivalent of the Meta-Polyp encoder
  pretrained_a: true
  pretrained_b: true
  channels: [64, 128, 320, 512]              # fused widths = Meta-Polyp stage widths
  fusion: [concat, concat, xattn, xattn]     # stages 1..4, or hybrid / all_concat / single_a / single_b
  fusion_heads: 8
  pos_enc_2d: false
  skip_convformer: false # reserved; true is not implemented

decoder:
  msu: false             # default off; exp007_hybrid_msu.yaml enables it
  msu_mode: paper        # paper | released (released is reserved for an ablation)

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

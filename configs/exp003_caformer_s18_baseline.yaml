# exp003 - Milestone 3 baseline: Meta-Polyp encoder (CAFormer-S18) + plain decoder.
# One branch only: no fusion and no MSU. Branch A is not built, so its pretrained
# flag is false; Branch B uses the pinned sail_in1k ImageNet weights.

run:
  name: exp003_caformer_s18_baseline
  seed: 42
  out_dir: runs

data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .jpg          # Kvasir-SEG masks are grayscale JPEG, not strictly binary
  mask_suffix: ""
  cache_path: data/cache/kvasir_seg_256.npz   # built by scripts/build_cache.py; "" reads JPEGs
  image_size: 256
  split_ratios: [0.8, 0.1, 0.1]
  split_seed: 42
  mask_threshold: 127
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2
  pin_memory: true

train:
  epochs: 100
  batch_size: 8
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5     # unused: Branch A is not built here
  lr_encoder_b: 1.0e-4    # pretrained Branch B (AGENTS.md section 4)
  lr_head: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  amp: true
  channels_last: false

model:
  encoder: caformer
  encoder_a: convnext_base.fb_in1k   # unused; Branch A is not built
  encoder_b: caformer_s18.sail_in1k
  pretrained_a: false     # unused; documented so the run cannot look dual-branch
  pretrained_b: true
  channels: [64, 128, 320, 512]
  fusion: [single_b, single_b, single_b, single_b]
  fusion_heads: 8
  pos_enc_2d: false
  msu: false
  msu_mode: paper
  skip_convformer: false

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

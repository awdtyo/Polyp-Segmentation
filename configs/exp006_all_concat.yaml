# exp006 - Milestone 4 ablation: all-concat dual-encoder fusion.
# Same two pretrained encoders and decoder as exp005, but every stage uses
# concat fusion. This isolates the contribution of the stage 3-4 cross-attention
# without changing the encoders or the data. MSU is off in this ablation.

run:
  name: exp006_all_concat
  seed: 42
  out_dir: runs

data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .jpg          # Kvasir-SEG masks are grayscale JPEG, not strictly binary
  mask_suffix: ""
  cache_path: data/cache/kvasir_seg_256.npz   # built by scripts/build_cache.py; "" reads JPEGs
  image_size: 256
  split_ratios: [0.8, 0.1, 0.1]
  split_seed: 42
  mask_threshold: 127
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2
  pin_memory: true

train:
  epochs: 100
  batch_size: 8
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5     # Branch A
  lr_encoder_b: 1.0e-4    # pretrained Branch B
  lr_head: 3.0e-4         # alignment + fusion + decoder + head
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  amp: true
  channels_last: false

model:
  encoder: dual
  encoder_a: convnext_base.fb_in1k
  encoder_b: caformer_s18.sail_in1k
  pretrained_a: true
  pretrained_b: true
  channels: [64, 128, 320, 512]
  fusion: all_concat      # [concat, concat, concat, concat]
  fusion_heads: 8
  pos_enc_2d: false
  skip_convformer: false

decoder:
  msu: false              # exp007 enables paper-mode MSU
  msu_mode: paper

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

run:
  name: exp003_p2_color_jitter
  seed: 42
  out_dir: runs
data:
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .jpg
  mask_ext: .jpg
  mask_suffix: ''
  cache_path: data/cache/kvasir_seg_256.npz
  image_size: 256
  split_ratios:
  - 0.8
  - 0.1
  - 0.1
  split_seed: 42
  mask_threshold: 127
  normalize: true
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
  num_workers: 2
  pin_memory: true
  augment:
    enabled: true
    hflip_p: 0.5
    vflip_p: 0.5
    rotation_degrees: 180.0
    rotation_p: 0.7
    random_resized_crop_scale:
    - 0.6
    - 1.0
    random_resized_crop_p: 0.7
    brightness_limit: 0.0
    contrast_limit: 0.0
    color_jitter_p: 0.8
    brightness_jitter: 0.25
    contrast_jitter: 0.25
    saturation_jitter: 0.25
    hue_jitter: 0.03
    color_jitter_combined_p: 0.8
train:
  epochs: 100
  batch_size: 8
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-05
  lr_encoder_b: 0.0001
  lr_head: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  amp: true
  channels_last: false
model:
  encoder: caformer
  encoder_a: convnext_base.fb_in1k
  encoder_b: caformer_s18.sail_in1k
  pretrained_a: false
  pretrained_b: true
  channels:
  - 64
  - 128
  - 320
  - 512
  fusion:
  - single_b
  - single_b
  - single_b
  - single_b
  fusion_heads: 8
  pos_enc_2d: false
  skip_convformer: false
decoder:
  msu: false
  msu_mode: paper
logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4

run:
  name: exp007_merged_adaptive_gated_fusion
  seed: 42
  out_dir: /content/drive/MyDrive/polyp-seg-runs

data:
  # Overridden by the launcher to point at the local merged copy
  root: data/raw
  image_dir: images
  mask_dir: masks
  split_dir: data/splits
  image_ext: .png
  mask_ext: .png
  mask_suffix: ""
  cache_path: ""
  image_size: 256
  split_ratios: [0.8, 0.1, 0.1]
  split_seed: 42
  mask_threshold: 127
  normalize: true
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  num_workers: 2
  pin_memory: true
  synthetic: false
  augment: {}

train:
  epochs: 30
  batch_size: 8
  loss: bce_dice
  bce_weight: 1.0
  dice_weight: 1.0
  lr_convnext: 3.0e-5
  lr_encoder_b: 1.0e-4
  lr_head: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 0
  grad_accum_steps: 1
  grad_clip_norm: 0.0
  amp: true
  channels_last: false

model:
  encoder: dual
  encoder_a: convnext_base.fb_in1k
  encoder_b: caformer_s18.sail_in1k
  pretrained_a: true
  pretrained_b: true
  channels: [64, 128, 320, 512]
  fusion: ["adaptive_gate", "adaptive_gate", "adaptive_gate", "adaptive_gate"]
  fusion_heads: 8
  pos_enc_2d: false
  skip_convformer: false

decoder:
  msu: false
  msu_mode: paper

logging:
  wandb: false
  wandb_project: polyp-dual-encoder
  log_images_every: 5
  num_log_images: 4